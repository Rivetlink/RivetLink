[package]
name = "rivetlink-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rivet-agent"
path = "src/main.rs"

[lib]
name = "rivetlink_agent"
path = "src/lib.rs"

[dependencies]
rivetlink-core = { workspace = true }
rivetlink-protocol = { workspace = true }
rivetlink-crypto = { workspace = true }
rivetlink-sdk = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
rand_08 = { workspace = true }
base64 = { workspace = true }
# Screen capture: ScreenCast portal + PipeWire on Linux, ScreenCaptureKit on
# macOS (where we pick the primary display programmatically — no picker dialog).
# Windows stays client-only for now (scap's Windows capture backend doesn't build).
scap = "0.0.8"
# Live-stream frames are JPEG tile-deltas on both host platforms, so this is general.
jpeg-encoder = "0.6"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# ashpd: the full-desktop Screenshot-portal fallback (Linux screenshot path).
# png: one-shot screenshot encoding via the ScreenCast portal (Linux only;
# macOS/Windows screenshots shell out to native tools).
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
png = "0.17"
url = "2"
