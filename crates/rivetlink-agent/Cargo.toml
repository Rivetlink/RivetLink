[package]
name = "rivetlink-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rivet-agent"
path = "src/main.rs"

[lib]
name = "rivetlink_agent"
path = "src/lib.rs"

[dependencies]
rivetlink-core = { workspace = true }
rivetlink-protocol = { workspace = true }
rivetlink-crypto = { workspace = true }
rivetlink-sdk = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
rand_08 = { workspace = true }
base64 = { workspace = true }
# Live-stream frames are JPEG tile-deltas on both host platforms, so this is general.
jpeg-encoder = "0.6"

[lints]
workspace = true

# macOS live capture: ScreenCaptureKit via scap (we pick the display
# programmatically — no picker dialog). Linux does NOT use scap: its libspa
# binding (PipeWire ~1.0) can't negotiate a stream with newer PipeWire daemons
# (Ubuntu 25.10+/26.04 ship 1.6+), and it won't even build against those
# headers. Linux capture goes through Mutter ScreenCast + GStreamer instead
# (see capture/mutter.rs) — version-proof and dialog-free. Windows stays
# client-only (scap's Windows backend doesn't build).
[target.'cfg(target_os = "macos")'.dependencies]
scap = "0.0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# evdev: just the KEY_*/BTN_* keycode constants for remote-input injection.
# Injection itself goes through Mutter's RemoteDesktop D-Bus API (no /dev/uinput,
# no udev, no root); Mutter's NotifyKeyboardKeycode takes these evdev codes.
evdev = "0.12"
# ashpd: the full-desktop Screenshot-portal fallback (Linux screenshot path).
# png: one-shot screenshot encoding (Linux screenshot fallback).
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
png = "0.17"
url = "2"
# zbus: talk to GNOME Mutter's ScreenCast D-Bus API to start a dialog-free
# screen cast and get a PipeWire node id. Shares tokio with the rest of the app.
zbus = { version = "4", default-features = false, features = ["tokio"] }
# Native, local-only X11 capture/input for an already-authorized GDM Xorg
# worker.  This talks only to the Unix socket selected by DISPLAY and uses the
# session's MIT-MAGIC-COOKIE; it never opens or listens on an X11 TCP socket.
x11rb = { version = "0.13", features = ["xtest"] }
