[package]
name = "rivetlink-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["post-quantum"]
post-quantum = ["dep:ml-dsa"]

[dependencies]
rivetlink-core = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
rand_08 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
dashmap = { workspace = true }
# Always needed for HKDF key derivation (SealedChannel) + hashing.
hkdf = { workspace = true }
sha2 = { workspace = true }
# Password-authenticated key agreement (SPAKE2) for direct LAN sessions.
spake2 = { workspace = true }

# ML-KEM is part of every session handshake (hybrid with x25519).
ml-kem = { workspace = true, features = ["zeroize"] }
# Post-quantum signatures (optional)
ml-dsa = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
