[workspace]
resolver = "2"
members = [
    "crates/rivetlink-core",
    "crates/rivetlink-protocol",
    "crates/rivetlink-crypto",
    "crates/rivetlink-server",
    "crates/rivetlink-agent",
    "crates/rivetlink-sdk",
    "crates/rivetlink-client",
]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Correctness — deny
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"

# Style — warn
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
manual_string_new = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
semicolon_if_nothing_returned = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
must_use_candidate = "allow"
return_self_not_must_use = "warn"

# Complexity — warn
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"

# Pedantic picks
enum_glob_use = "warn"
wildcard_imports = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
match_wildcard_for_single_variants = "warn"

# Security
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rivetlink/rivetlink"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Crypto
ed25519-dalek = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand_08 = { package = "rand", version = "0.8" }
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }

# Post-Quantum Crypto (NIST FIPS 203/204)
ml-kem = "0.3"
ml-dsa = "0.1"
hkdf = "0.13"
sha2 = "0.11"

# WebRTC
webrtc = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Types
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

# Auth & security
argon2 = "0.5"
jsonwebtoken = "9"
# SPAKE2 balanced PAKE — password-authenticated key agreement for direct LAN.
spake2 = "0.4"

# Async utilities
async-trait = "0.1"

# mDNS service discovery — find/advertise hosts on the local network.
mdns-sd = "0.11"

# Concurrency
dashmap = "6"

# CLI
clap = { version = "4", features = ["derive"] }
base64 = "0.22"

# Internal crates
rivetlink-core = { path = "crates/rivetlink-core" }
rivetlink-protocol = { path = "crates/rivetlink-protocol" }
rivetlink-crypto = { path = "crates/rivetlink-crypto" }
rivetlink-sdk = { path = "crates/rivetlink-sdk" }
