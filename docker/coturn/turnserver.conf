# RivetLink TURN server configuration
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=65535

# Use fingerprint in TURN message
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Realm
realm=rivetlink.local

# Logging
log-file=/var/log/coturn/turnserver.log
verbose
